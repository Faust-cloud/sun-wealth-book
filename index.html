<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财富自由革命之路</title>
<style>
:root{
  --paper:#f4eee2; --side:#ebe3d3; --ink:#2b2520; --ink2:#5b5246; --mute:#9a8f7f; --rule:#dccfb8;
  --accent:#9c3d2e; --hl:rgba(232,196,90,.38); --barbg:rgba(244,238,226,.92);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi",var(--serif);
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --fs:19px; --col:34em;
  --sel:rgba(156,61,46,.16); --cur:rgba(156,61,46,.25);
}
html.dark{
  --paper:#262523; --side:#2d2b28; --ink:#c9c2b5; --ink2:#a39b8d; --mute:#746d62; --rule:#3a3733;
  --accent:#d08a73; --hl:rgba(232,196,90,.2); --barbg:rgba(38,37,35,.92);
  --sel:rgba(208,138,115,.32); --cur:rgba(208,138,115,.45);
}
/* 护眼配色：豆沙绿、浅灰（浅色）；暖棕（深色） */
html[data-theme="green"]{
  --paper:#cfe3c9; --side:#c2d8bb; --ink:#26302a; --ink2:#4a5a4a; --mute:#7c8c78; --rule:#b0c7a9;
  --accent:#8a3a2c; --barbg:rgba(207,227,201,.92);
}
html[data-theme="gray"]{
  --paper:#d7d4ce; --side:#ccc8c1; --ink:#2b2926; --ink2:#55514b; --mute:#85807a; --rule:#bdb8b0;
  --accent:#8f3a2c; --barbg:rgba(215,212,206,.92);
}
html[data-theme="brown"]{
  --paper:#3a332b; --side:#332d26; --ink:#d6c9b0; --ink2:#b1a48c; --mute:#877b68; --rule:#4c443a;
  --accent:#d9937a; --hl:rgba(232,196,90,.22); --barbg:rgba(58,51,43,.92);
  --sel:rgba(217,147,122,.32); --cur:rgba(217,147,122,.45);
}
.more .themes{display:flex;gap:10px;padding:10px 16px 12px;border-top:1px solid var(--rule);margin-top:4px}
.more .fsz{display:flex;align-items:center;gap:4px;padding:8px 12px 10px;border-top:1px solid var(--rule);font:13px var(--sans);color:var(--mute)}
.more .fsz span{flex:1;padding-left:4px}
.more .fsz button{width:auto;padding:5px 10px;border:1px solid var(--rule);border-radius:4px;color:var(--ink2);justify-content:center}
.more .fsz b{min-width:2.4em;text-align:center;font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums}
.more .themes button{width:auto;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mute)}
.more .themes i{display:block;width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.more .themes button.on{color:var(--ink)}
.more .themes button.on i{box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink2)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s;
  background-image:radial-gradient(rgba(120,90,40,.05) 1px,transparent 1px);background-size:4px 4px}

html.dark body{background-image:radial-gradient(rgba(255,240,210,.025) 1px,transparent 1px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--sel)}

/* 顶栏 */
.bar{position:fixed;inset:0 0 auto 0;height:48px;display:flex;align-items:center;gap:6px;padding:0 14px;backdrop-filter:blur(8px);
  background:var(--barbg);border-bottom:1px solid var(--rule);z-index:20;font-family:var(--sans);transition:background-color .3s,border-color .3s}
.bar .ico{width:34px;height:34px;display:grid;place-items:center;color:var(--ink2);font-size:16px;border-radius:4px}
.bar .ico:hover{background:var(--side);color:var(--ink)}
.bar .brand{font:15px var(--kai);letter-spacing:.12em;color:var(--ink2);cursor:pointer;padding:0 6px}
.bar .sp{flex:1}
.more{position:fixed;top:44px;right:14px;z-index:30;display:none;min-width:150px;padding:6px 0;background:var(--paper);
  border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.08);font:14px var(--sans)}
.more.show{display:block}
.more button{display:flex;justify-content:space-between;width:100%;padding:9px 16px;color:var(--ink2);text-align:left}
.more button:hover{background:var(--side);color:var(--ink)}
.more button span{color:var(--mute);font-size:12px}
.prog{position:fixed;top:47px;left:0;height:1px;background:var(--ink2);opacity:.5;width:0;z-index:21}

/* 布局 */
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);padding-top:48px;min-height:100vh;transition:grid-template-columns .25s ease}
aside{position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto;padding:16px 10px 60px 18px;background:var(--side);
  font-family:var(--sans)}
body.closed .wrap{grid-template-columns:0 minmax(0,1fr)}
body.closed aside{padding:0;overflow:hidden;visibility:hidden}
.edge{position:fixed;top:50%;left:280px;transform:translate(-50%,-50%);z-index:22;width:16px;height:44px;display:grid;place-items:center;
  color:var(--mute);background:var(--paper);border:1px solid var(--rule);border-radius:8px;font-size:12px;opacity:.7;transition:left .25s ease,opacity .2s}
.edge:hover{opacity:1;color:var(--ink)}
body.closed .edge{left:0;transform:translate(0,-50%);border-left:0;border-radius:0 8px 8px 0}

/* 目录 */
aside input{width:100%;padding:7px 2px;font:13.5px var(--sans);color:var(--ink);background:none;border:0;border-bottom:1px solid var(--rule);outline:none;margin:0 0 10px}
aside input:focus{border-bottom-color:var(--ink2)}
aside input::placeholder{color:var(--mute)}
.part h4{position:sticky;top:0;z-index:2;margin:0;padding:12px 4px 8px;background:var(--side);cursor:pointer;user-select:none;
  display:flex;align-items:baseline;gap:10px;font:400 13.5px var(--sans);color:var(--ink2)}
.part h4 .pn{color:var(--mute);font-size:12px;min-width:3em}
.part h4 .pt{flex:1}
.part h4 .pc{color:var(--mute);font-size:11.5px}
.part h4:hover,.part.cur h4{color:var(--ink)}
.part .eps{display:none;padding:0 0 8px}
.sect{margin:22px 0 4px;padding:16px 4px 4px;border-top:1px solid var(--rule);font:400 12px var(--sans);color:var(--accent);letter-spacing:.16em}
.sect:first-of-type{margin-top:2px;padding-top:4px;border-top:0}
.sect span{display:block;margin-top:3px;font:600 15px var(--serif);color:var(--ink);letter-spacing:.04em}
.part.open .eps{display:block}
.ep{display:flex;align-items:baseline;gap:10px;padding:5px 4px 5px 8px;font:400 13px/1.55 var(--sans);color:var(--ink2);border-left:2px solid transparent}
.ep i{font-style:normal;font-size:11.5px;color:var(--mute);min-width:2em;text-align:right;font-variant-numeric:tabular-nums}
.ep .tt{flex:1;min-width:0}
.ep:hover{color:var(--ink)}
.ep.on{color:var(--ink);border-left-color:var(--accent)}
.ep .hits{font-style:normal;font-size:11px;color:var(--mute)}
/* 已读：标题变淡，当前章仍正常显示 */
.ep.done .tt{color:var(--mute)}
.ep.done.on .tt,.ep.done:hover .tt{color:var(--ink)}
.qsum{font-size:12px;color:var(--mute);line-height:1.6;margin:0 0 4px}

/* 搜索跳转 */
mark{background:var(--hl);color:inherit;padding:0 1px}
mark.cur{background:var(--cur)}
.find{position:fixed;right:20px;bottom:64px;z-index:30;display:none;align-items:center;gap:2px;padding:4px 6px 4px 12px;
  background:var(--paper);border:1px solid var(--rule);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.08);font:13px var(--sans);color:var(--ink2)}
.find.show{display:flex}
.find .t{max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find .p{color:var(--mute);min-width:4em;text-align:center;font-variant-numeric:tabular-nums}
.find button{width:26px;height:26px;display:grid;place-items:center;color:var(--mute);border-radius:4px}
.find button:hover{background:var(--side);color:var(--ink)}

/* 划线与笔记 */
.hl{background:linear-gradient(transparent 62%,var(--hl) 62%);cursor:pointer}
.hl.has-note{border-bottom:1px dashed var(--mute)}
.hl.flash{animation:flash 1.6s ease}
@keyframes flash{0%,50%{background:var(--hl)}}
.pop{position:absolute;z-index:40;display:none;background:var(--paper);border:1px solid var(--rule);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.1);font:13px var(--sans)}
.pop.show{display:block}
.pop .row{display:flex;padding:2px}
.pop .row.end{justify-content:flex-end;padding:0 6px 6px}
.pop button{padding:7px 12px;color:var(--ink2);white-space:nowrap;border-radius:4px}
.pop button:hover{background:var(--side);color:var(--ink)}
.pop .nt{max-width:300px;padding:10px 14px;font:14px/1.75 var(--serif);color:var(--ink);border-bottom:1px solid var(--rule);white-space:pre-wrap}
.pop .q{max-width:320px;padding:10px 14px 0;font-size:12px;color:var(--mute);line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pop textarea{display:block;width:320px;max-width:calc(100vw - 40px);height:110px;margin:10px 12px 8px;padding:8px 10px;font:14px/1.75 var(--serif);
  background:var(--side);color:var(--ink);border:1px solid var(--rule);border-radius:4px;outline:none;resize:vertical}

main{padding:0 32px 120px}

/* 封面 */
.cover{max-width:var(--col);margin:0 auto;padding:14vh 0 40px}
.cover h1{font:400 clamp(40px,6vw,60px)/1.2 var(--kai);margin:0;letter-spacing:.06em;color:var(--accent)}
.cover .sub{margin:14px 0 0;font-size:15px;color:var(--ink2);line-height:1.9}
.cover .go{margin:36px 0 0;font:14px var(--sans);color:var(--ink2);display:flex;gap:22px;align-items:baseline}
.cover .go a{color:var(--ink);border-bottom:1px solid var(--ink2);padding-bottom:2px}
.cover .go a:hover{color:var(--accent);border-color:var(--accent)}
.cover .go span{color:var(--mute);font-size:12.5px}
.toc{margin:6vh 0 0}
.toc .blk{margin:0 0 30px}
.toc .blk h3{font:400 13px var(--sans);color:var(--mute);margin:0 0 8px;letter-spacing:.08em}
.toc .blk a{display:flex;align-items:baseline;gap:14px;font-size:15.5px;line-height:2;color:var(--ink)}
.toc .blk a i{font:normal 12px var(--sans);color:var(--mute);min-width:2em;text-align:right;font-variant-numeric:tabular-nums}
.toc .blk a:hover{color:var(--accent)}
.toc .sh{margin:52px 0 22px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.toc .sh:first-child{margin-top:0}
.toc .sh b{display:block;font:400 12px var(--sans);color:var(--accent);letter-spacing:.2em;margin-bottom:4px}
.toc .sh span{font:600 23px var(--serif);color:var(--ink);letter-spacing:.04em}
.toc .sh p{display:none}
.note{font:12px/1.9 var(--sans);color:var(--mute);margin-top:40px;padding-top:16px;border-top:1px solid var(--rule)}

/* 正文 */
.chap{max-width:var(--col);margin:0 auto;padding:10vh 0 0}
.chap .crumb{font:12.5px var(--sans);color:var(--mute);letter-spacing:.06em}
.chap h2{font:400 clamp(26px,3.2vw,34px)/1.45 var(--kai);margin:14px 0 0;letter-spacing:.02em;color:var(--accent)}
.chap h2::after{content:"";display:block;width:28px;height:1px;background:var(--accent);opacity:.5;margin:22px 0 44px}
.chap .body p{font-size:calc(var(--fs) + var(--fsd,0px));line-height:2;margin:0 0 1.1em;text-align:justify;text-indent:2em;letter-spacing:.01em}
.chap .body p:first-child{text-indent:0}
.chap .end{margin:48px 0 0;font:12.5px var(--sans);color:var(--mute);display:flex;gap:18px}
.chap .end a,.chap .end button{color:var(--mute);font-size:12.5px}
.chap .end a:hover,.chap .end button:hover{color:var(--ink)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:28px 0 0;padding-top:22px;border-top:1px solid var(--rule);font-family:var(--sans)}
.pager a{display:block;padding:6px 0}
.pager a small{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.pager a span{font:15px/1.6 var(--serif);color:var(--ink2)}
.pager a:hover span{color:var(--ink)}
.pager .nx{text-align:right}

/* 笔记页 */
.notes{max-width:var(--col);margin:0 auto;padding:10vh 0 40px}
.notes h1{font:400 34px var(--kai);margin:0;letter-spacing:.06em;color:var(--accent)}
.notes .sub{margin:12px 0 0;font:13px/1.8 var(--sans);color:var(--mute)}
.notes .acts{margin:14px 0 48px;font:13px var(--sans);display:flex;gap:18px;flex-wrap:wrap}
.notes .acts button{color:var(--ink2);border-bottom:1px solid var(--rule);padding-bottom:1px}
.notes .acts button:hover{color:var(--ink);border-color:var(--ink2)}
.bakbox{margin:-30px 0 48px;font:13px/1.7 var(--sans);color:var(--ink2)}
.bakbox textarea{display:block;box-sizing:border-box;width:100%;height:140px;margin:8px 0 10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:4px;resize:vertical}
.bakbox button{margin-right:18px;color:var(--ink2);border-bottom:1px solid var(--rule);padding-bottom:1px}
.bakbox button:hover{color:var(--ink);border-color:var(--ink2)}
.notes .empty{font-size:15.5px;line-height:2;color:var(--ink2)}
.ng{margin:0 0 44px}
.ng h3{font:400 13px var(--sans);color:var(--mute);margin:0 0 16px;letter-spacing:.04em}
.ng h3 a:hover{color:var(--ink)}
.ng h3 i{font-style:normal;margin-right:8px;font-variant-numeric:tabular-nums}
.ni{margin:0 0 26px}
.ni blockquote{margin:0;padding-left:16px;border-left:2px solid var(--rule);font-size:16px;line-height:1.95;color:var(--ink)}
.ni .nn{margin:10px 0 0 18px;font-size:14.5px;line-height:1.9;color:var(--ink2);white-space:pre-wrap}
.ni .nm{margin:8px 0 0 18px;font:12px var(--sans);color:var(--mute);display:flex;gap:16px}
.ni .nm button{font-size:12px;color:var(--mute)}
.ni .nm button:hover{color:var(--ink)}

/* 打印全书 */
.printall .chap{padding-top:0}
.printall .ptitle{text-align:center;padding:30vh 0}
.printall .ptitle h1{font:400 48px var(--kai);margin:0;letter-spacing:.1em}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  aside{position:fixed;top:48px;left:0;width:84vw;max-width:320px;z-index:19;transform:translateX(-105%);transition:transform .25s;box-shadow:6px 0 24px rgba(0,0,0,.08)}
  body.nav aside{transform:none;visibility:visible;padding:16px 10px 60px 18px}
  body.closed .wrap{grid-template-columns:1fr}
  .edge{display:none}
  main{padding:0 22px 120px}
  .cover{padding-top:9vh}
  .chap{padding-top:6vh}
  :root{--fs:17.5px}
}
@media print{
  @page{size:A5;margin:16mm 14mm 18mm}
  html.dark,html[data-theme]{--paper:#fff;--ink:#222;--ink2:#555;--mute:#999;--rule:#ddd;--accent:#9c3d2e;--hl:transparent}
  .bar,.prog,aside,.pager,.edge,.find,.pop,.more,.chap .end{display:none!important}
  .wrap{display:block;padding:0}
  main{padding:0}
  mark{background:none}
  .hl{background:none;border:0}
  .chap{max-width:none;padding:0;break-before:page}
  .chap h2{margin-bottom:24px}
  .chap .body p{font-size:10.5pt;line-height:1.85}
}
</style>
</head>
<body>
<div class="bar">
  <button class="ico" id="menu" title="目录（T）" aria-label="目录">☰</button>
  <div class="brand" id="home">财富自由革命之路</div>
  <div class="sp"></div>
  <button class="ico" id="morebtn" title="更多" aria-label="更多">⋯</button>
</div>
<div class="more" id="more">
  <button id="notesbtn">我的笔记<span id="ncount"></span></button>
  <div class="themes" id="themes"></div>
  <div class="fsz"><span>字号</span><button id="fsm" title="缩小（-）">A−</button><b id="fsv"></b><button id="fsp" title="放大（+）">A＋</button></div>
  <button id="printall">整本存为 PDF</button>
</div>
<div class="prog" id="prog"></div>
<div class="find" id="find">
  <span class="t" id="fterm"></span><span class="p" id="fpos"></span>
  <button id="fprev" title="上一处（Shift+Enter）">↑</button><button id="fnext" title="下一处（Enter）">↓</button><button id="fclose" title="关闭（Esc）">×</button>
</div>
<div class="wrap">
  <aside id="side">
    <input id="q" placeholder="搜索">
    <div id="nav"></div>
  </aside>
  <button class="edge" id="edge"></button>
  <main id="main"></main>
</div>

<script src="data.js"></script>
<script>
// 依照作者在 018、020、021 期公布的课纲编排：篇 → 卷 → 章；显示编号为阅读顺序，内部仍用原始期数（笔记与链接不受影响）
const R=(a,b)=>Array.from({length:b-a+1},(_,k)=>a+k);
const SECTS=[
 ["第一篇","开宗明义","什么是财富自由，这门课要讲什么。"],
 ["第二篇","明道：看清时代","为什么这个时代、这一代人最有机会。"],
 ["第三篇","体用：三大革命","三十岁前不结婚、不买房、不买车。"],
 ["第四篇","术：怎么做","从第一桶金到踩准行业和趋势。"],
 ["第五篇","防御：守住财富","财富最常从疾病和家人那里流失。"],
 ["尾声","一个人的明治维新","一周年复盘与完结。"],
 ["附录","番外","演讲、对谈、荐书与问答，可按兴趣挑着读。"]
];
// [卷, 卷名, 期号, 简介, 所属篇]
const PARTS=[
 ["卷一","发刊与课纲",[...R(1,7),18,20,21],"名人推荐、创刊词，以及作者亲口讲的五十二周课纲。",0],
 ["卷二","财富自由是什么",[...R(8,17),19],"不为金钱做价值观的妥协；因精神自由而财富自由。",0],
 ["卷三","中国九零后新时代",R(22,30),"传统社会的最后一次转型、穷人思维、性与权力、金钱与自由、兜底义务。",1],
 ["卷四","全球流动性过剩",[31,32,33,34,36,37],"钱不值钱的大通胀时代、布雷顿森林、鼓励可控负债、激进而非保守。",1],
 ["卷五","一人即一国",[38,39],"价值观战争、自由意志主义与利己主义、成年即自由选择。",1],
 ["卷六","不结婚",R(40,46),"婚姻是经济结盟，是选家庭合伙人。",2],
 ["卷七","不买房、不买车",[47,48,...R(50,54),116,56,57,58,61,60,62],"房子祛魅、游牧民族、共享经济，以及十年之约。",2],
 ["卷八","原始积累与个人奋斗",[63,64,65,69,70,71,73,74],"复利、每项强 1%、1X50 与 5X10、一万小时、反馈；个人奋斗的合法性。",3],
 ["卷九","拥抱不确定性",[75,76,...R(82,87)],"薛定谔的猫、MVP、正收益系统、稳定是最大的不稳定。",3],
 ["卷十","互联网与比特币",[...R(88,97),...R(101,104)],"增量、远离管制、最后一条上升通道；比特币原理与买卖。",3],
 ["卷十一","金钱流向",R(131,138),"金钱流向规则制定领域、非线性通道、弯道超车、打破规则。",3],
 ["卷十二","新科技与区块链",R(139,142),"From It to Bit：碳基到硅基、数字资产、粉丝金融。",3],

function paras(x){

  x.split("\n").forEach(line=>{
    line=line.replace(/\s*\[\d{1,2}:\d{2}(:\d{2})?\]\s*/g,"").replace(/。\s+/g,"。").replace(/\s{2,}/g," ").trim();
    if(!line) return;

    const ss=line.match(/[^。！？]+[。！？”"]*|[^。！？]+$/g)||[line];
    let buf="";

    if(buf){ if(out.length && buf.length<60) out[out.length-1]+=buf; else out.push(buf) }
  });
  return out;
}

  const b=ev.target.closest("button"); if(!b) return; const a=b.dataset.a;
  if((a==="hl"||a==="hlnote")&&PEND){
    const x={id:nid(),n:B[CUR].n,p:PEND.p,s:PEND.s,p2:PEND.p2,e:PEND.e,text:PEND.text,note:"",t:Date.now()};
    NOTES.push(x); saveNotes();
    (locate(x,bodyPs())||[]).forEach(([p,s,e])=>wrap(p,s,e,x));
    getSelection().removeAllRanges();
    if(a==="hlnote") editNote(x.id); else hidePop();
  }
  else if(a==="copy"&&PEND){ if(navigator.clipboard) navigator.clipboard.writeText(PEND.text); getSelection().removeAllRanges(); hidePop() }
  else if(a==="edit") editNote(b.dataset.id);
  else if(a==="del") delNote(b.dataset.id);
  else if(a==="save") saveNote(b.dataset.id);
  else if(a==="cancel") hidePop();
});
POP.addEventListener("keydown",ev=>{
  if(ev.target.id!=="nta") return; ev.stopPropagation();
  if(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault(); const s=POP.querySelector('[data-a="save"]'); if(s) saveNote(s.dataset.id)}
  if(ev.key==="Escape") hidePop();
});
document.addEventListener("click",ev=>{
  if(POP.contains(ev.target)) return;
  const h=ev.target.closest&&ev.target.closest(".hl");
  if(h&&getSelection().isCollapsed){
    const x=NOTES.find(z=>z.id===h.dataset.id); if(!x) return; PEND=null;
    showPop(`${x.note?`<div class="nt">${esc(x.note)}</div>`:""}<div class="row"><button data-a="edit" data-id="${x.id}">${x.note?"编辑笔记":"写笔记"}</button><button data-a="del" data-id="${x.id}">删除划线</button></div>`,h.getBoundingClientRect());
    return;
  }
  if(!EDITING&&getSelection().isCollapsed) hidePop();
});

/* 笔记页 */
function grouped(){
  const g={}; NOTES.forEach(x=>(g[x.n]=g[x.n]||[]).push(x));
  return Object.keys(g).sort((a,b)=>ORDER.indexOf(+a-1)-ORDER.indexOf(+b-1)).map(n=>({n,e:B[parseInt(n,10)-1],list:g[n].sort((a,b)=>a.p-b.p||a.s-b.s)}));
}
function notesView(keep){
  const y=scrollY;
  CUR=-1; $("#find").classList.remove("show");
  const gs=grouped(), withNote=NOTES.filter(x=>x.note).length;
  const h=gs.map(g=>`<div class="ng"><h3><i>${SQ(g.n)}</i><a href="#/${g.n}">${esc(split(g.e.t).title)}</a></h3>`+
    g.list.map(x=>`<div class="ni${x.note?" has-note":""}"><blockquote>${esc(x.text).replace(/\n/g,"<br>")}</blockquote>${x.note?`<div class="nn">${esc(x.note)}</div>`:""}
      <div class="nm"><span>${fmtd(x.t)}</span><button data-go="${x.id}">回到原文</button><button data-ed="${x.id}">${x.note?"编辑笔记":"写笔记"}</button><button data-del="${x.id}">删除</button></div></div>`).join("")+`</div>`).join("");
  $("#main").innerHTML=`<section class="notes">
    <h1>笔记</h1>
    <div class="sub">${NOTES.length?`${gs.length} 章里共 ${NOTES.length} 处划线，其中 ${withNote} 条写了想法。`:"还没有划线。"}笔记只保存在当前浏览器里，换电脑或清理浏览器数据前，记得先导出或备份。</div>
    <div class="acts"><button data-x="md">导出 Markdown</button><button data-x="copy">复制</button><button data-x="bak">备份</button><button data-x="res">恢复备份</button><input type="file" id="resf" accept=".json,application/json" hidden></div>
    <div class="bakbox" id="bakbox" hidden></div>
    ${h||`<p class="empty">读的时候用鼠标选中一段正文，就可以划线或写下想法。划过的句子会汇总在这里，可以导出成 Markdown。</p>`}
  </section>`;
  document.title="我的笔记 · 财富自由革命之路"; window.scrollTo(0,keep?y:0); prog();
}
function toMD(){
  let m=`# 《财富自由革命之路》读书笔记\n\n导出于 ${fmtd(Date.now())}，共 ${NOTES.length} 处划线。\n`;
  grouped().forEach(g=>{
    m+=`\n## ${SQ(g.n)} ${split(g.e.t).title}\n\n`;
    g.list.forEach(x=>{ m+=x.text.split("\n").map(l=>"> "+l).join("\n>\n")+"\n\n"; if(x.note) m+=x.note+"\n\n" });
  });
  return m;
}
function download(name,text,type){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},800);
}
function flashBtn(b,t){const o=b.textContent; b.textContent=t; setTimeout(()=>b.textContent=o,1600)}
$("#main").addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b||!location.hash.startsWith("#/notes")) return;
  const d=b.dataset;
  if(d.go){const x=NOTES.find(z=>z.id===d.go); if(x){JUMP=x.id; location.hash="#/"+x.n}}
  else if(d.ed){LR=b.getBoundingClientRect(); editNote(d.ed)}
  else if(d.del){if(confirm("删除这条划线？")) delNote(d.del)}
  else if(d.x==="md"){ if(!NOTES.length) return flashBtn(b,"还没有划线"); download(`财富自由革命之路-笔记-${fmtd(Date.now())}.md`,toMD(),"text/markdown;charset=utf-8") }
  else if(d.x==="copy"){ if(!NOTES.length) return flashBtn(b,"还没有划线"); navigator.clipboard.writeText(toMD()).then(()=>flashBtn(b,"已复制"),()=>flashBtn(b,"复制失败")) }
  else if(d.x==="bak"){
    const j=JSON.stringify({v:1,notes:NOTES});
    download(`财富自由革命之路-备份-${fmtd(Date.now())}.json`,j,"application/json");
    // 有的页面不允许下载，所以同时把备份内容摆出来，复制粘贴也能搬
    const bx=$("#bakbox"); bx.hidden=false;
    bx.innerHTML=`如果没有自动下载，就把下面这段全部复制下来，到另一个页面点“恢复备份”粘贴进去。<textarea id="baktxt" readonly></textarea><button data-x="bakcopy">复制这段</button>`;
    const t=$("#baktxt"); t.value=j; t.focus(); t.select();
  }
  else if(d.x==="bakcopy"){ const t=$("#baktxt"); t.select(); navigator.clipboard.writeText(t.value).then(()=>flashBtn(b,"已复制"),()=>{document.execCommand("copy")?flashBtn(b,"已复制"):flashBtn(b,"请按 Cmd+C 复制")}) }
  else if(d.x==="res"){
    const bx=$("#bakbox"); bx.hidden=false;
    bx.innerHTML=`把备份内容粘贴到下面，再点“恢复”；也可以选择备份文件。<textarea id="restxt" placeholder="在这里粘贴备份内容"></textarea><button data-x="respaste">恢复</button><button data-x="resfile">选择备份文件</button><span id="resmsg"></span>`;
    $("#restxt").focus();
  }
  else if(d.x==="respaste"){ restoreFrom($("#restxt").value) }
  else if(d.x==="resfile"){ $("#resf").click() }
});
function restoreFrom(txt){
  let o; try{o=JSON.parse(txt)}catch(e){ const m=$("#resmsg"); if(m) m.textContent="这段内容不是有效的备份，请确认完整复制了。"; return }
  const ids=new Set(NOTES.map(z=>z.id)); let k=0;
  (o.notes||[]).forEach(z=>{if(z&&z.id&&!ids.has(z.id)){NOTES.push(z);k++}});
  saveNotes(); buildNav(Q); notesView();
  const bx=$("#bakbox"); bx.hidden=false; bx.textContent=`已恢复 ${k} 条新划线，现在一共 ${NOTES.length} 条。`;
}
$("#main").addEventListener("change",ev=>{
  if(ev.target.id!=="resf"||!ev.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>restoreFrom(r.result);
  r.readAsText(ev.target.files[0]);
});
$("#notesbtn").onclick=()=>{location.hash="#/notes"};
// 「更多」菜单：点按钮开合，点菜单项或别处收起
$("#morebtn").onclick=ev=>{ev.stopPropagation(); $("#more").classList.toggle("show")};
document.addEventListener("click",ev=>{if(!ev.target.closest("#morebtn")) $("#more").classList.remove("show")});
updNcount();

let qt; $("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>buildNav(e.target.value),150)});
buildNav(); route();
</script>
</body>
